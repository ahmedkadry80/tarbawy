<form class="container mt-5" id="videoForm">
  <input type="text" name="title" class="form-control mb-2" placeholder="Video title">
  <input type="file" name="video" class="form-control mb-2">
  <button class="btn btn-primary">Upload</button>
</form>

<script>
document.getElementById('videoForm').onsubmit = async e => {
  e.preventDefault();

  const formData = new FormData(e.target);

  await fetch('/api/videos/upload', {
    method: 'POST',
    body: formData
  });

  alert('Uploaded');
};
</script>
