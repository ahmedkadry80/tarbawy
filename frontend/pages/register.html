<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Register | Tarbawy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create account on Tarbawy">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background:#f4f6f9; }
    .auth-box { max-width:450px; margin:auto; }
  </style>
</head>

<body>

<div class="container vh-100 d-flex align-items-center">
  <div class="auth-box card shadow-sm p-4 w-100">

    <div class="text-end mb-3">
      <button class="btn btn-sm btn-outline-secondary" onclick="toggleLang()">AR / EN</button>
    </div>

    <h4 class="text-center mb-3" data-i18n="title">إنشاء حساب</h4>

    <form>
      <div class="mb-2">
        <label class="form-label" data-i18n="name">الاسم</label>
        <input type="text" class="form-control" required>
      </div>

      <div class="mb-2">
        <label class="form-label" data-i18n="email">البريد الإلكتروني</label>
        <input type="email" class="form-control" required>
      </div>

      <div class="mb-2">
        <label class="form-label" data-i18n="password">كلمة المرور</label>
        <input type="password" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label" data-i18n="role">نوع الحساب</label>
        <select class="form-select">
          <option value="student" data-i18n="student">طالب</option>
          <option value="teacher" data-i18n="teacher">معلم</option>
        </select>
      </div>

      <button class="btn btn-primary w-100" data-i18n="create">إنشاء حساب</button>
    </form>

    <p class="text-center mt-3">
      <span data-i18n="haveAccount">لديك حساب؟</span>
      <a href="login.html" data-i18n="login">تسجيل الدخول</a>
    </p>

  </div>
</div>

<script>
let lang = 'ar';

const t = {
  ar: {
    title: 'إنشاء حساب',
    name: 'الاسم',
    email: 'البريد الإلكتروني',
    password: 'كلمة المرور',
    role: 'نوع الحساب',
    student: 'طالب',
    teacher: 'معلم',
    create: 'إنشاء حساب',
    haveAccount: 'لديك حساب؟',
    login: 'تسجيل الدخول'
  },
  en: {
    title: 'Create Account',
    name: 'Name',
    email: 'Email',
    password: 'Password',
    role: 'Account Type',
    student: 'Student',
    teacher: 'Teacher',
    create: 'Create Account',
    haveAccount: 'Already have an account?',
    login: 'Login'
  }
};

function toggleLang() {
  lang = lang === 'ar' ? 'en' : 'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t[lang][el.dataset.i18n];
  });
}
</script>

</body>
</html>
