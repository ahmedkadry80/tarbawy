<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Teacher Dashboard | Tarbawy</title>

  <!-- SEO -->
  <meta name="description" content="لوحة تحكم المعلم في منصة تربوي">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <h2 class="mb-4">📚 كورساتي</h2>

  <!-- Create Course -->
  <div class="card mb-4">
    <div class="card-body">
      <h5>إنشاء كورس جديد</h5>

      <form id="courseForm">
        <input type="text" class="form-control mb-2" placeholder="اسم الكورس" name="title">
        <textarea class="form-control mb-2" placeholder="وصف الكورس" name="description"></textarea>
        <input type="number" class="form-control mb-2" placeholder="السعر (0 = مجاني)" name="price">
        <button class="btn btn-primary">إنشاء</button>
      </form>
    </div>
  </div>

  <!-- Courses List -->
  <div id="courses" class="row"></div>

</div>

<script>
const teacherId = 1; // مؤقتًا (JWT لاحقًا)

document.getElementById('courseForm').onsubmit = async e => {
  e.preventDefault();

  const form = e.target;

  await fetch('/api/courses/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      teacher_id: teacherId,
      title: form.title.value,
      description: form.description.value,
      price: form.price.value
    })
  });

  loadCourses();
};

async function loadCourses() {
  const res = await fetch(`/api/courses/teacher/${teacherId}`);
  const courses = await res.json();

  const container = document.getElementById('courses');
  container.innerHTML = '';

  courses.forEach(c => {
    container.innerHTML += `
      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-body">
            <h5>${c.title}</h5>
            <p>${c.description}</p>
            <span class="badge bg-${c.is_free ? 'success' : 'warning'}">
              ${c.is_free ? 'مجاني' : c.price + ' EGP'}
            </span>
            <a href="upload-video.html?course=${c.id}" class="btn btn-sm btn-outline-primary mt-2">
              إضافة فيديو
            </a>
          </div>
        </div>
      </div>
    `;
  });
}

loadCourses();
</script>

</body>
</html>
