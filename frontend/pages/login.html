<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Login | Tarbawy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Login to Tarbawy platform">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background:#f4f6f9; }
    .auth-box { max-width:420px; margin:auto; }
  </style>
</head>

<body>

<div class="container vh-100 d-flex align-items-center">
  <div class="auth-box card shadow-sm p-4 w-100">

    <div class="text-end mb-3">
      <button class="btn btn-sm btn-outline-secondary" onclick="toggleLang()">AR / EN</button>
    </div>

    <h4 class="text-center mb-3" data-i18n="title">تسجيل الدخول</h4>

    <form>
      <div class="mb-3">
        <label class="form-label" data-i18n="email">البريد الإلكتروني</label>
        <input type="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label" data-i18n="password">كلمة المرور</label>
        <input type="password" class="form-control" required>
      </div>

      <button class="btn btn-primary w-100" data-i18n="login">دخول</button>
    </form>

    <p class="text-center mt-3">
      <span data-i18n="noAccount">ليس لديك حساب؟</span>
      <a href="register.html" data-i18n="register">إنشاء حساب</a>
    </p>

  </div>
</div>

<script>
let lang = 'ar';

const t = {
  ar: {
    title: 'تسجيل الدخول',
    email: 'البريد الإلكتروني',
    password: 'كلمة المرور',
    login: 'دخول',
    noAccount: 'ليس لديك حساب؟',
    register: 'إنشاء حساب'
  },
  en: {
    title: 'Login',
    email: 'Email',
    password: 'Password',
    login: 'Login',
    noAccount: "Don't have an account?",
    register: 'Register'
  }
};

function toggleLang() {
  lang = lang === 'ar' ? 'en' : 'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t[lang][el.dataset.i18n];
  });
}
</script>

</body>
</html>
