<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard | Tarbawy</title>
  <meta name="description" content="لوحة تحكم الطالب في منصة تربوي">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <h2 class="mb-4">🎓 كورساتي</h2>

  <div id="courses" class="row"></div>

</div>

<script>
const studentId = 5; // مؤقتًا (JWT لاحقًا)

async function loadCourses() {
  const res = await fetch(`/api/student/${studentId}/courses`);
  const courses = await res.json();

  const container = document.getElementById('courses');
  container.innerHTML = '';

  courses.forEach(c => {
    container.innerHTML += `
      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-body">
            <h5>${c.title}</h5>
            <p>${c.description}</p>
            <a href="student-course.html?course=${c.id}" class="btn btn-primary">
              دخول الكورس
            </a>
          </div>
        </div>
      </div>
    `;
  });
}

loadCourses();
</script>

</body>
</html>
