<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard | Tarbawy</title>
  <meta name="description" content="لوحة تحكم الطالب في منصة تربوي">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">

  <h2 class="mb-4">🎓 كورساتي</h2>

  <div id="courses" class="row"></div>

</div>

<script>
const user = JSON.parse(localStorage.getItem('user'));
if (!user || user.role !== 'student') {
  window.location.href = 'login.html';
}
const studentId = user.id;

async function loadCourses() {
  const res = await fetch(`/api/courses/student/${studentId}`);
  const courses = await res.json();

  const container = document.getElementById('courses');
  container.innerHTML = '';

  courses.forEach(c => {
    container.innerHTML += `
      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-body">
            <h5>${c.title}</h5>
            <p>${c.description}</p>
            <a href="student-course.html?course=${c.id}" class="btn btn-primary">
              دخول الكورس
            </a>
          </div>
        </div>
      </div>
    `;
  });
}

loadCourses();
</script>

</body>
</html>
