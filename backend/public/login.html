<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Login | Tarbawy</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Login to Tarbawy platform">

  <!-- Bootstrap (Local) -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body>

<div class="container vh-100 d-flex align-items-center">
  <div class="auth-box card shadow-sm p-4 w-100">

    <div class="text-end mb-3">
      <button id="langBtn" class="btn btn-sm btn-outline-secondary">
        AR / EN
      </button>
    </div>

    <h4 class="text-center mb-3" data-i18n="title">تسجيل الدخول</h4>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label" data-i18n="email">البريد الإلكتروني</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label" data-i18n="password">كلمة المرور</label>
        <input type="password" name="password" class="form-control" required>
      </div>

      <button class="btn btn-primary w-100" data-i18n="login">
        تسجيل الدخول
      </button>
    </form>

    <p class="text-center mt-3">
      <span data-i18n="noAccount">ليس لديك حساب؟</span>
      <a href="register.html" data-i18n="register">إنشاء حساب</a>
    </p>

  </div>
</div>

<!-- External JS only -->
<script src="assets/js/login.js"></script>

</body>
</html>
